plugins {
    id 'com.android.application'
}

def ciUnsignedRelease = providers.gradleProperty('ciUnsignedRelease').orNull == 'true'
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.carboxhub.app'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.carboxhub.app'
        minSdk 23
        targetSdk 28
        versionCode 9
        versionName '0.1.8'
    }

    if (!ciUnsignedRelease) {
        signingConfigs {
            release {
                if (!keystorePropertiesFile.exists()) {
                    throw new GradleException('Missing keystore.properties. Restore the CarBoxHub release signing files before building release.')
                }

                def signingStoreFile = rootProject.file(keystoreProperties['storeFile'])
                if (!signingStoreFile.exists()) {
                    throw new GradleException("Missing release keystore: ${signingStoreFile}")
                }

                storeFile signingStoreFile
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (!ciUnsignedRelease) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
